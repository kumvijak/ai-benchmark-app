services:
  benchmark-control:
    build: .
    container_name: aig-benchmark-control
    ports:
      - "${APP_PORT:-18080}:8080"
    environment:
      APP_SECRET: "${APP_SECRET:?APP_SECRET must be set}"
      APP_LOCAL_USER_EMAIL: "${APP_LOCAL_USER_EMAIL:?APP_LOCAL_USER_EMAIL must be set}"
      APP_REPORT_WORKER_MODE: "external"
      APP_DB_PATH: "/data/app.db"
      APP_ARTIFACT_DIR: "/data/artifacts"
      APP_REPORT_ARCHIVE_BUCKET: "${APP_REPORT_ARCHIVE_BUCKET:-}"
      APP_REPORT_ARCHIVE_REGION: "${APP_REPORT_ARCHIVE_REGION:-us-ashburn-1}"
      APP_REPORT_ARCHIVE_NAMESPACE: "${APP_REPORT_ARCHIVE_NAMESPACE:-}"
      APP_REPORT_ARCHIVE_AUTH: "${APP_REPORT_ARCHIVE_AUTH:-principal}"
      APP_REPORT_ARCHIVE_LINK_HOURS: "${APP_REPORT_ARCHIVE_LINK_HOURS:-168}"
    volumes:
      - benchmark-control-data:/data

  report-worker:
    build: .
    command: ["python", "-m", "app.report_worker"]
    restart: unless-stopped
    environment:
      APP_DB_PATH: "/data/app.db"
      APP_ARTIFACT_DIR: "/data/artifacts"
      APP_REPORT_ARCHIVE_BUCKET: "${APP_REPORT_ARCHIVE_BUCKET:-}"
      APP_REPORT_ARCHIVE_REGION: "${APP_REPORT_ARCHIVE_REGION:-us-ashburn-1}"
      APP_REPORT_ARCHIVE_NAMESPACE: "${APP_REPORT_ARCHIVE_NAMESPACE:-}"
      APP_REPORT_ARCHIVE_AUTH: "${APP_REPORT_ARCHIVE_AUTH:-principal}"
      APP_REPORT_ARCHIVE_LINK_HOURS: "${APP_REPORT_ARCHIVE_LINK_HOURS:-168}"
    volumes:
      - benchmark-control-data:/data

volumes:
  benchmark-control-data:
